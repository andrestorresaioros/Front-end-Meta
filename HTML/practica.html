<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <label for="dob">Date of birth:</label>
    <input type="color" id="dob" name="date of birth">
    <label for="volume">Volume:</label>
    <input type="range" id="volume" name="volume" min="0" max="10">
    <input type="reset">
    <textarea name="response" rows="10" cols="30" maxlength=”200” readonly> 
    </textarea> 
    <figure> 
        <img src="photo.png" width="320" alt="My Profile Photo"> 
        <figcaption>A photo of myself on a beach in 2015</figcaption> 
     </figure>
    <button type="button" onclick="alert('You just clicked!')">Click Me! 
    </button> 
</body>
</html>
